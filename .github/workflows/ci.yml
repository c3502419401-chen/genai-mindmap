name: CI

on:
  push:
    branches: [main, dev]
  # PR 的 base 不限：拆成多个叠起来的分支时（如 R3 叠在 R2 上），
  # 目标分支不是 dev 也要有检查结果，否则那个 PR 没有 CI 可看。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    # `ubuntu-latest` 已经迁到 26.04（2026-11 实测：日志里 Runner Image 就是
    # ubuntu-26.04），但那个标签会随着迁移窗口再变。CI 的机器版本不该跟着别人的
    # 日程走：某天 `-latest` 换到别的发行版时，失败会表现为"依赖装不上"或"某个
    # 系统库换了名字"，与本项目改了什么毫无关系。写死能换版本的大版本号。
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      # 几个"逐字节对比旧版本"的测试用 `git show <commit>:path` 载历史文件
      # （`test_edges` / `test_agent_diagram_type` / `test_external_directions`），
      # 最远的一个基线提交距 HEAD 一百多个提交。checkout 默认 `fetch-depth: 1`，
      # 那些提交不在，`git show` 会以 128 退出，测试在 CI 上必红而本地必绿。
      # 拉全量历史：仓库不大，代价远低于让这些回归测试在 CI 上永久失效。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Test
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=0

      # 前端的契约类型由这份快照生成。忘了重新导出时，本地那条 pytest
      # （tests/test_openapi_snapshot.py）会红；这里再多一层：即便快照更新了，
      # 也要确认提交上去的就是重新生成过的结果，而不是手改的。
      - name: OpenAPI 快照
        run: |
          python scripts/export_openapi.py
          git -C .. diff --exit-code backend/openapi.json

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # 生成结果必须与提交的文件一致：后端加了字段却没跑 npm run gen:api 时，
      # 这里会红，而不是等到某天字段被静默丢掉才发现。
      - name: 契约类型
        run: |
          npm run gen:api
          git -C .. diff --exit-code frontend/src/api/schema.d.ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
