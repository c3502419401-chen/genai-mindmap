name: CI

on:
  push:
    branches: [main, dev]
  # PR 的 base 不限：拆成多个叠起来的分支时（如 R3 叠在 R2 上），
  # 目标分支不是 dev 也要有检查结果，否则那个 PR 没有 CI 可看。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    # `ubuntu-latest` 已经迁到 26.04（2026-11 实测：日志里 Runner Image 就是
    # ubuntu-26.04），但那个标签会随着迁移窗口再变。CI 的机器版本不该跟着别人的
    # 日程走：某天 `-latest` 换到别的发行版时，失败会表现为"依赖装不上"或"某个
    # 系统库换了名字"，与本项目改了什么毫无关系。写死能换版本的大版本号。
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      # 几个"逐字节对比旧版本"的测试用 `git show <commit>:path` 载历史文件
      # （`test_edges` / `test_agent_diagram_type` / `test_external_directions`），
      # 最远的一个基线提交距 HEAD 一百多个提交。checkout 默认 `fetch-depth: 1`，
      # 那些提交不在，`git show` 会以 128 退出，测试在 CI 上必红而本地必绿。
      # 拉全量历史：仓库不大，代价远低于让这些回归测试在 CI 上永久失效。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # ruff 一直没有进 CI，代价是三类 lint 漏了三次，每次都是一行、每次都让
      # `ruff check .` 红过一段时间（`tests/test_few_branches.py` 的 F401、
      # `scripts/_blind_pack.py:83` 的 F541、`scripts/_probe_join_rule.py` 的 F401）。
      # n 次里没有一次是难改，全是"没人跑"。
      #
      # 版本必须钉死：ruff 的默认规则集随版本变宽，浮动版本会让一次无关的升级把
      # 历史代码判红，然后人们学会无视这条检查。升级版本应当是独立的一次提交，
      # 顺带把新增的告警清干净。本地同样是 0.9.10（`python -m ruff --version`）。
      - name: Lint（ruff）
        run: |
          pip install "ruff==0.9.10"
          python -m ruff check .

      # 探针脚本的另一半保护。`ruff` 管"文件名内"的问题（未使用的导入、空 f-string），
      # 但它不核对 `from app.x import 名字` 里那个名字还在不在——那是探针脚本跟着
      # `app/**` 重构漂掉的主要形态。这里补上"能不能加载"与"import 目标还在不在"，
      # 外加"docs 引用的脚本是否存在""临时产物有没有悄悄落库""部署文档里的开关还有
      # 没有人在读"。五档的机制与取舍都在 `scripts/check_script_hygiene.py` 的 docstring 里。
      #
      # 确定性与上面那条棘轮同一标准：判据是 `scripts/`、`docs/`、`.env.example` 的
      # 树形内容，只有 artifacts 一档读 `git check-ignore`（用来确认产物被忽略而不是游离）。
      - name: 探针脚本卫生
        run: python scripts/check_script_hygiene.py --gate

      - name: Test
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=0

      # 「用例测了函数、没测接线」这一类的静态闸门，机制与理由都在
      # `scripts/acc3/find_unwired.py` 的 docstring 里。它是**棘轮**不是绝对零：
      # 基线（`scripts/acc3/unwired_baseline.json`）之外的零引用公开函数才红，
      # 每条基线都要写理由与 `evidence`，凭据文件被删而条目还在也红。
      #
      # 为什么这里不需要额外依赖：脚本只 import 标准库（`ast` / `json` /
      # `pathlib` / `re` / `collections` / `dataclasses`），上面那条 Install 装的
      # 东西已经够了。
      #
      # 为什么它在这里是确定性的：判据是**三棵源码树的文本**（`app/`、`tests/`、
      # `scripts/`），不读运行中的服务、不读数据库、不读 git 状态或工作区差异；
      # 路径一律以 `__file__` 为锚。所以在 CI 的干净 checkout 上与本地逐行一致
      # （已用一个干净 worktree 对过：515 / 66 / 11 / 5 四个读数相同）。
      - name: 零引用函数棘轮
        run: python scripts/acc3/find_unwired.py --gate

      # 前端的契约类型由这份快照生成。忘了重新导出时，本地那条 pytest
      # （tests/test_openapi_snapshot.py）会红；这里再多一层：即便快照更新了，
      # 也要确认提交上去的就是重新生成过的结果，而不是手改的。
      - name: OpenAPI 快照
        run: |
          python scripts/export_openapi.py
          git -C .. diff --exit-code backend/openapi.json

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # 生成结果必须与提交的文件一致：后端加了字段却没跑 npm run gen:api 时，
      # 这里会红，而不是等到某天字段被静默丢掉才发现。
      - name: 契约类型
        run: |
          npm run gen:api
          git -C .. diff --exit-code frontend/src/api/schema.d.ts

      - name: Test
        run: npm test

      # 用例的成本棘轮：核对每条"贵用例"的超时上限是否还压在满载耗时的 1.5 倍以内
      # （红线）、2 倍以内（黄线）。三次在负载上翻车（`docs/TEST-LOAD-SENSITIVITY.md`）
      # 的共同形态是"这一条加宽"，而 CI 只会在下一次 push 时才知道——这里把"哪条其实
      # 没有余量"提前变成一次静态比对。
      #
      # 为什么它是确定性的：判据是 `tests/**/*.spec.ts` 的**文本**（解析 `{ timeout }`）
      # 加一份落库的基线 `scripts/test-cost-baseline.json`（本机满载实测），
      # 不跑测试、不读运行时、不读 git 状态；路径以 `import.meta.url` 为锚。
      # 与后端 job 的 `find_unwired.py --gate` 同一套棘轮语义：基线之外的用例不阻断。
      #
      # 放在 `npm test` 之后：先看真实的红，再看"它迟早会红"。
      - name: 用例成本闸门
        run: npm run test:cost:gate

      # 「后端加了路由 → client.ts 加了函数 → 没有任何界面代码调用它」这一类静态缺口，
      # 机器与理由都写在 `scripts/find_unwired.mjs` 的 docstring 里。它是**棘轮**不是
      # 绝对零：基线（`scripts/unwired_baseline.json`）里的四条各自写着为什么可以零引用，
      # 闸门只对基线之外的新增报错；基线里的 `evidence` 文件被删掉也会红（豁免的理由
      # 没了而豁免还在）。
      #
      # 为什么这里不需要额外依赖：脚本只 import 标准库（`node:fs` / `node:path` /
      # `node:url`）加 `typescript`——后者是 devDependencies 里已有的（`vue-tsc` 也靠它），
      # `npm ci` 之后就在 `frontend/node_modules` 里。`npx` 之类会联网的东西一概没有。
      #
      # 为什么它在 CI 上是确定性的：判据是 `src/**`、`tests/**` 与基线 JSON 的**文本**，
      # 用 `ts.createSourceFile` 数语法树里的标识符（注释里提到函数名不算引用）；不读
      # 运行时、不读数据库、不读 git 状态或工作区差异，路径一律以 `import.meta.url` 为锚。
      # 所以在干净 checkout 上与本地逐字节一致（已用一个干净 worktree 对过读数）。
      #
      # 顺序：放在 `npm test` 之后、`npm run build` 之前。它比 build 快得多，而失败信息
      # 比 build 的 TS 报错更贴题（build 只会说"某某没有导出"，说不出"没人调用"）。
      - name: 零引用棘轮
        run: node scripts/find_unwired.mjs --gate

      - name: Build
        run: npm run build
